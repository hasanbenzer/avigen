<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <defs>
    <!-- 1. Üst Mavi/Siyan Kanat Teleği -->
    <linearGradient id="avWingBlue" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <!-- 2. Ana Gövde & Baş (Mor -> Macenta) -->
    <linearGradient id="avBodyMagenta" x1="0%" y1="20%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="50%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <!-- 3. Orta Sağ İndigo/Lacivert Kanat -->
    <linearGradient id="avWingIndigo" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- 4. Alt Pembe -> Turuncu -> Altın Sarı Kanat -->
    <linearGradient id="avWingSunset" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <!-- 5. Alt Göğüs/Kuyruk Turkuaz -> Zümrüt -->
    <linearGradient id="avTailTeal" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- 5. Alt Turkuaz/Zümrüt Kuyruk Katmanı -->
  <path d="M 68 68 C 82 95, 86 135, 102 165 C 112 182, 126 190, 145 190 C 128 170, 122 140, 118 105 Z" fill="url(#avTailTeal)"/>

  <!-- 3. Orta Sağ İndigo/Mavi Kanat Katmanı -->
  <path d="M 122 102 C 155 82, 195 82, 228 112 C 198 106, 175 125, 145 124 C 132 123, 124 114, 122 102 Z" fill="url(#avWingIndigo)"/>

  <!-- 4. Pembe -> Altın Sarı Göğüs/Kanat Katmanı -->
  <path d="M 76 74 C 102 115, 136 162, 172 152 C 188 148, 200 138, 206 132 C 175 142, 148 122, 124 94 Z" fill="url(#avWingSunset)"/>

  <!-- 1. Üst Mavi/Siyan Kanat Teleği -->
  <path d="M 102 36 C 135 24, 172 52, 212 50 C 188 68, 152 68, 126 56 C 115 50, 106 43, 102 36 Z" fill="url(#avWingBlue)"/>

  <!-- 2. Ana Baş, Gaga ve Mor/Macenta Üst Gövde -->
  <path d="M 18 66 L 46 46 C 58 30, 78 28, 96 42 C 126 66, 158 76, 194 66 C 170 96, 136 114, 102 104 C 82 98, 68 74, 52 66 C 38 60, 26 63, 18 66 Z" fill="url(#avBodyMagenta)"/>
