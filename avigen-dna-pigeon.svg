<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="260" height="220">
  <defs>
    <!-- Arka Plan Genetik Aura -->
    <radialGradient id="auraPurple" cx="62%" cy="48%" r="56%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.38"/>
      <stop offset="48%" stop-color="#0066ff" stop-opacity="0.22"/>
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f5f3ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auraCyan" cx="72%" cy="68%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Güvercin Gövde & Kanat 3B Tonlaması -->
    <linearGradient id="pigeonHeadNeck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="iridescentGreenPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="68%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="wingShield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- 3B Parlayan DNA Sarmalı Gradyanları -->
    <linearGradient id="dnaHelixA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="45%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="dnaHelixB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Işık Aurası -->
  <circle cx="155" cy="108" r="105" fill="url(#auraPurple)"/>
  <circle cx="178" cy="145" r="78" fill="url(#auraCyan)"/>

  <!-- Arka Plan İkincil DNA Sarmalı (Derinlik Katmanı) -->
  <g opacity="0.42">
    <path d="M165,215 C175,180 225,175 232,140 C238,105 195,95 208,58 C218,32 245,25 255,5" fill="none" stroke="url(#dnaHelixB)" stroke-width="3"/>
    <path d="M192,215 C180,182 155,168 172,135 C188,102 235,102 242,65 C248,35 222,22 232,5" fill="none" stroke="url(#dnaHelixA)" stroke-width="2.5" stroke-dasharray="4 3"/>
  </g>

  <!-- Şampiyon Yarış Güvercini Gövdesi (Tam Sağ-Alt Dolu Kompozisyon) -->
  <g>
    <!-- Kuyruk ve Alt Gövde -->
    <path d="M32,192 L88,155 L118,175 L52,206 Z" fill="#1e293b"/>
    <path d="M24,184 L86,148 L104,162 L38,195 Z" fill="#334155"/>

    <!-- Göğüs, Sırt ve Baş Silüeti -->
    <path d="M75,168 C92,135 112,110 128,74 C133,56 132,38 145,26 C158,15 178,16 190,28 C198,36 198,48 192,58 C186,70 198,92 204,116 C210,145 192,178 162,194 C138,206 105,196 75,168 Z" fill="url(#pigeonHeadNeck)" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Yanardöner Zümrüt Yeşili & Mor Boyun Tüyleri -->
    <path d="M124,84 C136,64 166,58 188,66 C196,86 202,108 196,128 C174,122 142,108 124,84 Z" fill="url(#iridescentGreenPurple)" opacity="0.92"/>
    <!-- Boyun Tüy Dokusu Çizgileri -->
    <path d="M135,76 Q160,72 182,80 M130,88 Q158,84 188,94 M134,100 Q162,98 192,110" fill="none" stroke="#a7f3d0" stroke-width="1.1" opacity="0.55"/>

    <!-- Kanat Kalkanı ve Çift Siyah Çubuk (Blue Bar Racing Wing) -->
    <path d="M64,174 C82,136 116,105 156,102 C178,101 190,118 184,142 C176,168 136,188 86,188 C74,188 64,182 64,174 Z" fill="url(#wingShield)" stroke="#f8fafc" stroke-width="1"/>
    <!-- Kanat Üzeri İki Karakteristik Yarış Çubuğu (Wing Bars) -->
    <path d="M98,165 C118,144 142,128 168,124" fill="none" stroke="#1e293b" stroke-width="5.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M82,175 C104,154 130,138 156,134" fill="none" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round" opacity="0.88"/>

    <!-- Ayaklar ve Resmi Yarış Bileziği (Künye) -->
    <path d="M142,190 L138,214 M130,214 L152,214" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
    <path d="M164,188 L168,214 M156,214 L180,214" stroke="#be123c" stroke-width="3" stroke-linecap="round"/>
    <!-- Gümüş/Mavi Yarış Bileziği -->
    <rect x="134" y="198" width="9" height="7" rx="1.5" fill="#0066ff" stroke="#e0f2fe" stroke-width="1"/>

    <!-- Gaga ve Beyaz Burun Eti (Cere) -->
    <path d="M192,38 L215,47 L191,51 Z" fill="#1e293b" stroke="#64748b" stroke-width="0.7"/>
    <ellipse cx="194" cy="39" rx="6.5" ry="4" transform="rotate(14 194 39)" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.6"/>

    <!-- Keskin Şampiyon Göz İşareti (Eye-Sign) -->
    <circle cx="168" cy="36" r="7.5" fill="#fde047" stroke="#0f172a" stroke-width="1.4"/>
    <circle cx="168" cy="36" r="5.2" fill="#ea580c"/>
    <circle cx="168" cy="36" r="2.6" fill="#090d16"/>
    <circle cx="169.8" cy="34.2" r="1.3" fill="#ffffff"/>
  </g>

  <!-- Ön Katman: Güvercini Saran 3B Parlayan Çift Sarmal DNA (Sol Alttan Sağ Üste Tam Dolu) -->
  <g filter="url(#softGlow)">
    <!-- DNA Baz Çiftleri (Nükleotid Basamakları) -->
    <line x1="78" y1="204" x2="104" y2="212" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="92" y1="184" x2="120" y2="195" stroke="#34d399" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="122" y1="152" x2="152" y2="165" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="140" y1="134" x2="170" y2="146" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="158" y1="115" x2="186" y2="126" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="194" y1="82" x2="222" y2="92" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="210" y1="62" x2="236" y2="72" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="224" y1="40" x2="248" y2="50" stroke="#34d399" stroke-width="2.4" stroke-linecap="round"/>

    <!-- DNA 1. Ana Omurga (Mavi - Mor) -->
    <path d="M65,218 C72,175 112,165 138,132 C164,98 218,98 235,55 C244,32 238,14 246,2" fill="none" stroke="url(#dnaHelixA)" stroke-width="5" stroke-linecap="round"/>
    <path d="M65,218 C72,175 112,165 138,132 C164,98 218,98 235,55 C244,32 238,14 246,2" fill="none" stroke="#e0f2fe" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>

    <!-- DNA 2. Ana Omurga (Zümrüt - Mor - Turkuaz) -->
    <path d="M108,218 C128,195 168,175 182,135 C196,95 178,72 206,38 C222,18 242,14 256,2" fill="none" stroke="url(#dnaHelixB)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M108,218 C128,195 168,175 182,135 C196,95 178,72 206,38 C222,18 242,14 256,2" fill="none" stroke="#f3e8ff" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>

    <!-- Genetik Işık Parçacıkları (Sağ Alt ve Orta Bölgeyi Dolduran Biyo-Fotonlar) -->
    <circle cx="195" cy="165" r="3" fill="#34d399" opacity="0.85"/>
    <circle cx="218" cy="148" r="2.2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="208" cy="188" r="2.5" fill="#a78bfa" opacity="0.85"/>
    <circle cx="235" cy="172" r="2" fill="#38bdf8" opacity="0.75"/>
    <circle cx="112" cy="112" r="2.2" fill="#a78bfa" opacity="0.8"/>
    <circle cx="142" cy="52" r="2" fill="#34d399" opacity="0.75"/>
  </g>
</svg>