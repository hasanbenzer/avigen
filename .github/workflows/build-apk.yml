name: Build AVIGEN Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'AVIGEN.apk'
      - 'avigen-signing.keystore'
      - 'icon-192.png'
      - 'icon-512.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Capacitor Android APK with AVIGEN Icon & Embedded 64 Pedigrees
        run: |
          mkdir -p /tmp/avigen_cap/www
          cd /tmp/avigen_cap
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 sharp

          node -e '
            const fs = require("fs");
            const path = require("path");
            const sharp = require("sharp");
            const ws = process.env.GITHUB_WORKSPACE;
            const rawSvg = fs.readFileSync(path.join(ws, "avigen-logo.svg"), "utf8");
            const innerSvg = rawSvg.replace(/<svg[^>]*>/i, "").replace(/<\/svg>/i, "");

            function makeSquareSvg(size, padRatio, rounded) {
              const pad = Math.round(size * padRatio);
              const w = size - pad * 2;
              const h = Math.round(w * (200 / 240));
              const x = pad;
              const y = Math.round((size - h) / 2);
              const rx = rounded ? Math.round(size * 0.22) : 0;
              return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
                <rect width="${size}" height="${size}" rx="${rx}" fill="#ffffff"/>
                <svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="0 0 240 200">${innerSvg}</svg>
              </svg>`;
            }

            (async () => {
              await sharp(Buffer.from(makeSquareSvg(192, 0.10, true))).png().toFile(path.join(ws, "icon-192.png"));
              await sharp(Buffer.from(makeSquareSvg(512, 0.10, true))).png().toFile(path.join(ws, "icon-512.png"));
              console.log("Generated PWA icons icon-192.png and icon-512.png");
            })();
          '

          cp "$GITHUB_WORKSPACE"/*.html "$GITHUB_WORKSPACE"/*.css "$GITHUB_WORKSPACE"/*.js "$GITHUB_WORKSPACE"/*.json "$GITHUB_WORKSPACE"/*.svg "$GITHUB_WORKSPACE"/*.jpg "$GITHUB_WORKSPACE"/*.png /tmp/avigen_cap/www/
          npx cap init "AVIGEN" "com.avigen.pigeonapp" --web-dir www
          npx cap add android

          node -e '
            const fs = require("fs");
            const path = require("path");
            const sharp = require("sharp");
            const ws = process.env.GITHUB_WORKSPACE;
            const rawSvg = fs.readFileSync(path.join(ws, "avigen-logo.svg"), "utf8");
            const innerSvg = rawSvg.replace(/<svg[^>]*>/i, "").replace(/<\/svg>/i, "");

            function makeIconSvg(size, padRatio, circle) {
              const pad = Math.round(size * padRatio);
              const w = size - pad * 2;
              const h = Math.round(w * (200 / 240));
              const x = pad;
              const y = Math.round((size - h) / 2);
              const bg = circle
                ? `<circle cx="${size/2}" cy="${size/2}" r="${size/2}" fill="#ffffff"/>`
                : `<rect width="${size}" height="${size}" rx="${Math.round(size*0.18)}" fill="#ffffff"/>`;
              return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
                ${bg}
                <svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="0 0 240 200">${innerSvg}</svg>
              </svg>`;
            }

            const resDir = "/tmp/avigen_cap/android/app/src/main/res";
            const mipmaps = [
              { folder: "mipmap-mdpi", size: 48, fg: 108 },
              { folder: "mipmap-hdpi", size: 72, fg: 162 },
              { folder: "mipmap-xhdpi", size: 96, fg: 216 },
              { folder: "mipmap-xxhdpi", size: 144, fg: 324 },
              { folder: "mipmap-xxxhdpi", size: 192, fg: 432 }
            ];

            (async () => {
              for (const m of mipmaps) {
                const dir = path.join(resDir, m.folder);
                if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
                await sharp(Buffer.from(makeIconSvg(m.size, 0.10, false))).png().toFile(path.join(dir, "ic_launcher.png"));
                await sharp(Buffer.from(makeIconSvg(m.size, 0.12, true))).png().toFile(path.join(dir, "ic_launcher_round.png"));
                await sharp(Buffer.from(makeIconSvg(m.fg, 0.24, false))).png().toFile(path.join(dir, "ic_launcher_foreground.png"));
              }
              const bgXmlPath = path.join(resDir, "values", "ic_launcher_background.xml");
              if (fs.existsSync(bgXmlPath)) {
                fs.writeFileSync(bgXmlPath, `<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>\n`);
              }
              console.log("Generated all Android mipmap launcher icons with AVIGEN logo");
            })();
          '

          # 1. version.json içinden güncel version (versionName) ve build (versionCode) değerlerini Android build.gradle içine otomatik yaz
          node -e '
            const fs = require("fs");
            const path = require("path");
            const ws = process.env.GITHUB_WORKSPACE;
            let verName = "4.0.0";
            let verCode = 400;
            try {
              const vj = JSON.parse(fs.readFileSync(path.join(ws, "version.json"), "utf8"));
              if (vj.version) verName = String(vj.version);
              if (vj.build) verCode = Number(vj.build) || 400;
            } catch (e) {}
            const gradlePath = "/tmp/avigen_cap/android/app/build.gradle";
            let g = fs.readFileSync(gradlePath, "utf8");
            g = g.replace(/versionCode\s+\d+/, "versionCode " + verCode);
            g = g.replace(/versionName\s+"[^"]+"/, "versionName \"" + verName + "\"");
            fs.writeFileSync(gradlePath, g, "utf8");
            console.log("Updated Android build.gradle -> versionCode:", verCode, "versionName:", verName);

            // AndroidManifest.xml içine Kamera, GPS Konum, Depolama ve Açık Bağlantı izinlerini ekle
            const manifestPath = "/tmp/avigen_cap/android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let mf = fs.readFileSync(manifestPath, "utf8");
              const extraPerms = [
                `<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />`,
                `<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />`,
                `<uses-permission android:name="android.permission.CAMERA" />`,
                `<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />`,
                `<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />`,
                `<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />`,
                `<uses-feature android:name="android.hardware.camera" android:required="false" />`,
                `<uses-feature android:name="android.hardware.location.gps" android:required="false" />`
              ].join("\n    ");
              if (!mf.includes("ACCESS_FINE_LOCATION")) {
                mf = mf.replace(/<uses-permission[^>]*INTERNET[^>]*\/>/, (m) => m + "\n    " + extraPerms);
              }
              if (!mf.includes("android:usesCleartextTraffic")) {
                mf = mf.replace("<application", `<application android:usesCleartextTraffic="true"`);
              }
              fs.writeFileSync(manifestPath, mf, "utf8");
              console.log("Injected Android GPS, Camera and Storage permissions into AndroidManifest.xml");
            }

            // Capacitor Android APK paketinin her acilista GitHub Pages uzerindeki en guncel canli surumu calistirmasini sagla
            const capCfgPath = "/tmp/avigen_cap/capacitor.config.json";
            if (fs.existsSync(capCfgPath)) {
              const capCfg = JSON.parse(fs.readFileSync(capCfgPath, "utf8"));
              capCfg.server = {
                url: "https://hasanbenzer.github.io/avigen/",
                cleartext: true,
                allowNavigation: ["hasanbenzer.github.io", "*.github.io", "*.openstreetmap.org", "*.google.com", "api.open-meteo.com"]
              };
              fs.writeFileSync(capCfgPath, JSON.stringify(capCfg, null, 2), "utf8");
              console.log("Configured Capacitor server.url to live GitHub Pages for zero-APK-install auto updates");
            }
          '
          npx cap sync android

          cat << 'EOF' > /tmp/avigen_cap/android/app/src/main/java/com/avigen/pigeonapp/MainActivity.java
          package com.avigen.pigeonapp;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.KeyEvent;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {
              private void evaluateAndroidBackOrFinish() {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().evaluateJavascript(
                          "(function(){ try { if (window.handleAndroidBackNavigation) { window.handleAndroidBackNavigation(); } return 'HANDLED'; } catch(e) { return 'HANDLED'; } })()",
                          value -> {
                              // Stay in app (navigated toward Ana Sayfa without closing the program)
                          }
                      );
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      WebView wv = getBridge().getWebView();
                      wv.getSettings().setJavaScriptEnabled(true);
                      wv.getSettings().setDomStorageEnabled(true);
                      wv.addJavascriptInterface(new AvigenJsBridge(), "AvigenNativeBridge");
                  }

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          evaluateAndroidBackOrFinish();
                      }
                  });
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  if (event != null && event.getKeyCode() == KeyEvent.KEYCODE_BACK) {
                      if (event.getAction() == KeyEvent.ACTION_UP && !event.isCanceled()) {
                          evaluateAndroidBackOrFinish();
                      }
                      return true;
                  }
                  return super.dispatchKeyEvent(event);
              }

              public class AvigenJsBridge {
                  @JavascriptInterface
                  public void exitApp() {
                      runOnUiThread(() -> finish());
                  }

                  @JavascriptInterface
                  public void openExternalUrl(String url) {
                      runOnUiThread(() -> {
                          try {
                              if (url == null || url.isEmpty()) return;
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Baglanti acilamadi: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void shareBase64File(String base64Data, String fileName, String mimeType, String title) {
                      runOnUiThread(() -> {
                          try {
                              String cleanName = (fileName != null && !fileName.isEmpty()) ? fileName.replaceAll("[^a-zA-Z0-9._-]", "_") : "AVIGEN_Pedigre.pdf";
                              String cleanMime = (mimeType != null && !mimeType.isEmpty()) ? mimeType : "application/pdf";
                              byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                              File outFile = new File(getCacheDir(), cleanName);
                              try (FileOutputStream fos = new FileOutputStream(outFile)) {
                                  fos.write(bytes);
                                  fos.flush();
                              }
                              Uri contentUri = FileProvider.getUriForFile(MainActivity.this, getPackageName() + ".fileprovider", outFile);
                              Intent shareIntent = new Intent(Intent.ACTION_SEND);
                              shareIntent.setType(cleanMime);
                              shareIntent.putExtra(Intent.EXTRA_STREAM, contentUri);
                              shareIntent.putExtra(Intent.EXTRA_SUBJECT, title != null ? title : cleanName);
                              shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              Intent chooser = Intent.createChooser(shareIntent, title != null ? title : "Dosyayi Paylas");
                              chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(chooser);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Paylasim hatasi: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void saveBase64FileToDownloads(String base64Data, String fileName, String mimeType) {
                      runOnUiThread(() -> {
                          try {
                              String cleanName = (fileName != null && !fileName.isEmpty()) ? fileName.replaceAll("[^a-zA-Z0-9._-]", "_") : "AVIGEN_Dosya.pdf";
                              String cleanMime = (mimeType != null && !mimeType.isEmpty()) ? mimeType : "application/pdf";
                              byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);

                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  ContentValues values = new ContentValues();
                                  values.put(MediaStore.Downloads.DISPLAY_NAME, cleanName);
                                  values.put(MediaStore.Downloads.MIME_TYPE, cleanMime);
                                  values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                                  ContentResolver resolver = getContentResolver();
                                  Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                                  if (uri != null) {
                                      try (OutputStream os = resolver.openOutputStream(uri)) {
                                          if (os != null) {
                                              os.write(bytes);
                                              os.flush();
                                          }
                                      }
                                  }
                              } else {
                                  File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                                  if (!dir.exists()) dir.mkdirs();
                                  File outFile = new File(dir, cleanName);
                                  try (FileOutputStream fos = new FileOutputStream(outFile)) {
                                      fos.write(bytes);
                                      fos.flush();
                                  }
                              }
                              Toast.makeText(MainActivity.this, "Indirilenler klasorune kaydedildi: " + cleanName, Toast.LENGTH_LONG).show();
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Kayit hatasi: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }
          }
          EOF

          # 2. Sabit Android İmza Anahtarı (avigen-release.keystore): Depoda varsa onu kullan, yoksa ilk kez oluşturup depoya kaydet!
          # Böylece bundan sonraki tüm APK güncellemeleri aynı dijital imzaya sahip olur ve eski APK silinmeden (veriler kaybolmadan) doğrudan üzerine kurulur!
          mkdir -p ~/.android
          if [ -f "$GITHUB_WORKSPACE/avigen-signing.keystore" ]; then
            cp "$GITHUB_WORKSPACE/avigen-signing.keystore" ~/.android/debug.keystore
            echo "Loaded persistent avigen-signing.keystore from repository"
          else
            keytool -genkey -v -keystore "$GITHUB_WORKSPACE/avigen-signing.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp "$GITHUB_WORKSPACE/avigen-signing.keystore" ~/.android/debug.keystore
            echo "Generated new persistent avigen-signing.keystore"
          fi

          cd /tmp/avigen_cap/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/AVIGEN.apk"

      - name: Commit AVIGEN.apk, persistent keystore and PNG icons to repository root
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AVIGEN.apk avigen-signing.keystore icon-192.png icon-512.png
          git commit -m "Update full-screen mobile AVIGEN.apk with persistent keystore and launcher icons" || true
          git push origin main

      - name: Publish GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: AVIGEN Android APK (Tam Ekran + AVIGEN Logolu + 64 Pedigri)
          files: AVIGEN.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
