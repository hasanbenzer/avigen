name: Build AVIGEN Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'AVIGEN.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Capacitor Android APK with Embedded 64 Pedigrees
        run: |
          mkdir -p /tmp/avigen_cap/www
          cp index.html styles.css real-pedigrees-64.js app.js genesis-ai.js performance-profile.js global-gene-pool.js scientific-library.js manifest.json sw.js avigen-logo.svg avigen-dna-pigeon.jpg avigen-dna-pigeon.svg /tmp/avigen_cap/www/
          cd /tmp/avigen_cap
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "AVIGEN" "com.avigen.pigeonapp" --web-dir www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/AVIGEN.apk"

      - name: Commit AVIGEN.apk to repository root for direct download link
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AVIGEN.apk
          git commit -m "Build direct download AVIGEN.apk" || true
          git push origin main

      - name: Publish GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: AVIGEN Android APK (64 Pedigrees Included)
          files: AVIGEN.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
